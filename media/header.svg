    <rect x="10" y="10" width="94" height="83" rx="14" fill="#253347" stroke="#41516a"/>
    <text x="57" y="62" text-anchor="middle" fill="#8ce0c4" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">API</text>
  </g>
  <g transform="translate(938 67)">
    <rect x="0" y="10" width="114" height="110" rx="20" fill="#080d16"/>
    <rect x="0" y="0" width="114" height="110" rx="20" fill="url(#key)" stroke="#54506c" stroke-width="2"/>
    <rect x="10" y="10" width="94" height="83" rx="14" fill="#34314c" stroke="#575174"/>
    <text x="57" y="62" text-anchor="middle" fill="#c5b5ff" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">AI</text>

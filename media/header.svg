<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Bhuvan M — Python backend and generative AI</title>
  <desc id="description">A dark banner with mint and lavender accents, and three illustrated keyboard keys marked API, AI, and Build.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a25"/>
      <stop offset="1" stop-color="#161528"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3446"/>
      <stop offset="1" stop-color="#20283a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b9c5e3" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="25" fill="url(#background)" stroke="#30384c" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="336" rx="24" fill="url(#grid)"/>
  <path d="M73 70h30" stroke="#8ce0c4" stroke-width="5" stroke-linecap="round"/>
  <text x="118" y="77" fill="#a5b2c7" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="3">BUILT WITH CURIOSITY</text>
  <text x="70" y="171" fill="#f3f5ff" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">Bhuvan M<tspan fill="#8ce0c4">.</tspan></text>
  <text x="74" y="218" fill="#c5d0e2" font-family="Segoe UI,Arial,sans-serif" font-size="25">Python backend + generative AI</text>
  <text x="74" y="279" fill="#90a0b9" font-family="Segoe UI,Arial,sans-serif" font-size="19">APIs. Agents. Useful software.</text>

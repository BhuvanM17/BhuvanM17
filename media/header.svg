    <text x="123" y="42" text-anchor="middle" fill="#dde6f5" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="2">build something ↵</text>
  </g>
  <circle cx="1106" cy="78" r="5" fill="#8ce0c4"/>
